<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>JYXR JSON 编辑器</title>
  <link rel="stylesheet" data-name="vs/editor/editor.main" href="/vendor/monaco/vs/editor/editor.main.css?v=20260708-monaco-1">
  <link rel="stylesheet" href="/styles.css?v=20260709-map-workbench-2">
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div>
        <div class="brand">JYXR JSON 编辑器</div>
        <div id="workspacePath" class="path-line"></div>
      </div>
      <div class="top-actions">
        <label class="mod-selector">
          <span>当前 MOD</span>
          <select id="modSelect"></select>
        </label>
        <button id="formatButton" type="button">格式化</button>
        <button id="validateButton" type="button">校验</button>
        <a class="button-link" href="/help.html" target="_blank" rel="noreferrer">帮助</a>
        <button id="saveButton" type="button" class="primary">保存</button>
      </div>
    </header>

    <main class="workspace-grid">
      <aside class="sidebar">
        <div class="tab-row" role="tablist" aria-label="文件类型">
          <button id="dataTab" type="button" class="tab active">数据</button>
          <button id="storyTab" type="button" class="tab">剧情</button>
          <button id="assetsTab" type="button" class="tab">资产</button>
        </div>
        <input id="fileSearch" class="search" type="search" placeholder="搜索文件">
        <div id="fileList" class="file-list" aria-label="文件列表"></div>
      </aside>

      <section class="editor-pane">
        <div class="pane-header">
          <div class="file-context">
            <div id="currentPath" class="current-path">未选择文件</div>
            <div id="currentFileSummary" class="current-file-summary">等待选择文件</div>
          </div>
          <div class="quick-actions" aria-label="创作工具">
            <button id="newStoryButton" type="button" class="primary">新建 Story</button>
            <button id="newSpeakerButton" type="button">新建说话人</button>
            <button id="portraitCheckButton" type="button">头像检查</button>
            <button id="characterCheckButton" type="button">角色/物品检查</button>
            <div id="dirtyState" class="dirty-state"></div>
          </div>
        </div>
        <div class="editor-tools">
          <button id="formModeButton" type="button">表单</button>
          <button id="jsonModeButton" type="button">JSON</button>
          <button id="mapFocusButton" type="button" class="map-focus-button hidden">地图工作台</button>
          <input id="contentSearch" class="content-search" type="search" placeholder="搜索当前文件">
          <select id="outlineSelect" class="outline-select" title="按剧情段标题跳转"></select>
          <button id="findPreviousButton" type="button">上一个</button>
          <button id="findNextButton" type="button">下一个</button>
          <div id="searchState" class="tool-state"></div>
        </div>
        <div id="formView" class="form-view hidden"></div>
        <div id="storyView" class="story-view hidden"></div>
        <textarea id="editor" class="legacy-editor" spellcheck="false" autocomplete="off" autocapitalize="off"></textarea>
        <div id="monacoHost" class="monaco-host hidden"></div>
        <div class="statusbar">
          <div id="cursorState">行 1，列 1</div>
          <div id="saveState"></div>
        </div>
      </section>

      <aside class="inspector">
        <section>
          <div class="section-title">校验</div>
          <div id="validationBox" class="message muted">等待校验</div>
        </section>
        <section>
          <div class="section-title">当前文件</div>
          <div id="currentFileBox" class="index-box muted">未选择文件</div>
        </section>
        <section>
          <div class="section-title">索引</div>
          <div id="indexBox" class="index-box muted">正在建立索引</div>
        </section>
        <section>
          <div class="section-title">选中</div>
          <div id="selectionBox" class="index-box muted">选中 JSON 字符串后显示定义</div>
        </section>
        <section>
          <div class="section-title">检查结果</div>
          <div id="checkResultsBox" class="check-results">
            <div id="portraitCheckBox" class="static-tool compact"></div>
            <div id="characterCheckBox" class="static-tool compact"></div>
          </div>
        </section>
        <section>
          <div class="section-title">资产</div>
          <div id="assetPreview" class="asset-preview muted">未选择资产</div>
        </section>
      </aside>
    </main>
  </div>

  <script src="/vendor/monaco/vs/loader.js?v=20260708-monaco-1"></script>
  <script src="/story-dsl.js?v=20260708-dsl-1"></script>
  <script src="/app.js?v=20260709-map-workbench-1"></script>
</body>
</html>
